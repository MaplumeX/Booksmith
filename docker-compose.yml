# Deployment target. Not verified in the development environment (no Docker there).
services:
  db:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_USER: booksmith
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: booksmith
    volumes:
      # postgres:18 moved its default PGDATA to /var/lib/postgresql/18/docker and
      # only declares /var/lib/postgresql as a volume, so mount the parent.
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U booksmith -d booksmith']
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    image: ${BOOKSMITH_IMAGE:-ghcr.io/maplumex/booksmith:latest}
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://booksmith:${POSTGRES_PASSWORD}@db:5432/booksmith
      ALLOWED_EMAILS: ${ALLOWED_EMAILS:-}
      AGENT_SECRET_KEY: ${AGENT_SECRET_KEY:-}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      PORT: 8787
    # Loopback only: the app is meant to sit behind a TLS reverse proxy on the host.
    ports:
      - '127.0.0.1:8787:8787'

volumes:
  db-data:
