<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Booksmith</title>
    <script>
      try {
        var raw = localStorage.getItem('booksmith:settings:v1');
        var parsed = raw ? JSON.parse(raw) : null;
        var mode = parsed && (parsed.theme === 'light' || parsed.theme === 'dark') ? parsed.theme : 'system';
        var resolved =
          mode === 'system'
            ? window.matchMedia('(prefers-color-scheme: dark)').matches
              ? 'dark'
              : 'light'
            : mode;
        document.documentElement.dataset.theme = resolved;
        if (parsed && typeof parsed.codeFontSize === 'number' && parsed.codeFontSize >= 12 && parsed.codeFontSize <= 18) {
          document.documentElement.style.setProperty('--editor-font-size', Math.round(parsed.codeFontSize) + 'px');
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
